id: id_calculated_payroll_data
kind: tool
namespace: support-team
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: Payroll contracts, calculated salary data, wage codes and employer instructions
payload:
  workspace_id: support-team-payroll
  read_only: true
  workspace_view: false
  expand_media_refs: false
  workspace_read:
    instructions: los21_contracts_employees.csv lists one row per contract (people with two contracts
      have contractCount > employeeCount). los21_calculated_data_summary.csv has one row per active employee
      per payment period (gross/taxable/net/social_deductions/fiscal_deductions/net_attribution/cost/total_cost).
      los21_calculated_data_lines.csv is the same data flattened to one row per line item. los21_employer_instructions.csv
      carries employer instructions and validation messages. los21_joint_committees.csv lists joint committees
      per dossier. wage_codes.csv documents every wage code per dossier, including employer-specific overrides
      (isClientSpecific=true).
