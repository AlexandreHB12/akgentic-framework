      ella-q885,fr,Un employeur peut-il remplacer les eco-cheques par un equivalent en salaire ?,eco-cheques,200,"Sur base de la legislation belge du travail, la regle suivante s'applique a 'eco-cheques' [1]. L'application concrete depend de l'anciennete, du statut et de la commission paritaire competente [2]. Verifiez toujours la CCT sectorielle, qui peut deroger au regime general [3].",4,40350,ok
      ella-q390,fr,Quel est le delai de preavis legal pour un employe avec 7 ans d'anciennete licencie par l'employeur ?,delai de preavis,200,"Sur base de la legislation belge du travail, la regle suivante s'applique a 'delai de preavis' [1]. L'application concrete depend de l'anciennete, du statut et de la commission paritaire competente [2]. Verifiez toujours la CCT sectorielle, qui peut deroger au regime general [3].",2,46629,ok
      ella-q245,fr,Quelles sont les conditions formelles d'un licenciement pour motif grave et dans quel delai ?,motif grave,124,"Sur base de la legislation belge du travail, la regle suivante s'applique a 'motif grave' [1]. L'application concrete depend de l'anciennete, du statut et de la commission paritaire competente [2]. Verifiez toujours la CCT sectorielle, qui peut deroger au regime general [3].",4,53810,ok
