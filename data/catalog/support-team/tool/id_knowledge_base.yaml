  - file_name: ten_commandments.csv
    file_type: text
    content: |
      language,number,title,content,source_file
      fr,1,Mode de licenciement,"Preavis (delai), rupture (indemnite), licenciement pour motif grave, fin pour force majeure medicale. Utilisez la langue legalement prescrite.",ten_commandments_fr.md
      fr,2,Type de contrat et anciennete,Duree indeterminee/determinee ou remplacement; ouvrier ou employe; debut avant ou depuis 2014 (sac a dos); ex-interimaire; anciennete reprise.,ten_commandments_fr.md
      fr,3,Reduction des prestations et travail a temps partiel,Calcul du sac a dos pour employes a temps partiel au 31.12.2013 sur salaire temps plein fictif; conges thematiques et credit-temps comme sans reduction.,ten_commandments_fr.md
      fr,4,Age,"Outplacement (regime residuaire 45+), RCC, age de pension 66+ avec delai de preavis reduit en vue de la mise a la retraite.",ten_commandments_fr.md
      fr,5,Protection contre le licenciement,"Repos de maternite, conge parental, credit-temps, membres CPPT/CE, delegues syndicaux, conseiller en prevention, conge-education, clause de securite d'emploi.",ten_commandments_fr.md
      fr,6,Motivation du licenciement,"Mentionnez le motif reel sur le C4. Motivation a la demande du travailleur: licenciement manifestement deraisonnable, abus de droit. Motif grave: motiver en detail.",ten_commandments_fr.md
      fr,7,Outplacement,"Regime general: preavis ou indemnite d'au moins 30 semaines. Regime residuaire: 45+, au moins 1 an d'anciennete, offre spontanee.",ten_commandments_fr.md
      fr,8,Mesures favorisant l'employabilite,"Pour travailleurs avec preavis ou indemnite d'au moins 30 semaines: formation, coaching, outplacement complementaire. Max. 1.800 EUR d'intervention ONEM.",ten_commandments_fr.md
      fr,9,Licenciement de plusieurs travailleurs a court terme,"Licenciement multiple, licenciement collectif ou fermeture d'entreprise: regles generales et/ou regles sectorielles et d'entreprise.",ten_commandments_fr.md
      fr,10,Remplacement,RCC et obligation de premier emploi (min. 50 travailleurs): obligation eventuelle de remplacement en cas de licenciement d'un jeune.,ten_commandments_fr.md
      fr,11,Obligations entre parties,"Employeur: conge de sollicitation, decompte de sortie, solde du droit a la formation, DIMONA sortie, eco-cheques, assurances. Travailleur: restitution du materiel.",ten_commandments_fr.md
      nl,1,Wijze van ontslag,"Opzegging (termijn), verbreking (vergoeding), ontslag om dringende reden, einde wegens medische overmacht. Gebruik de wettelijk voorgeschreven taal.",ten_commandments_nl.md
      nl,2,Type arbeidsovereenkomst en anciënniteit,Onbepaalde/bepaalde duur of vervanging; arbeider of bediende; aanvang voor of vanaf 2014 (rugzak); voorheen uitzendkracht; overgenomen anciënniteit.,ten_commandments_nl.md
      nl,3,Vermindering arbeidsprestaties en deeltijdse arbeid,Rugzak-berekening voor deeltijdse bedienden op 31.12.2013 op fictief voltijds loon; thematisch verlof en tijdskrediet alsof er geen vermindering was.,ten_commandments_nl.md
      nl,4,Leeftijd,"Outplacement (residuair 45+), SWT, pensioenleeftijd 66+ met verkorte opzeggingstermijn bij ontslag met oog op oppensioenstelling.",ten_commandments_nl.md
      nl,5,Ontslagbescherming,"Moederschapsrust, ouderschapsverlof, tijdskrediet, leden CPBW/OR, syndicaal afgevaardigden, preventieadviseur, educatief verlof, werkzekerheidsclausule.",ten_commandments_nl.md
