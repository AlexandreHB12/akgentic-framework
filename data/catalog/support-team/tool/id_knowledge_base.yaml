      ella-q141,nl,Hoe bereken ik het dubbel vakantiegeld voor een bediende die in mei in dienst is getreden?,dubbel vakantiegeld,124,"Op basis van de Belgische arbeidswetgeving geldt het volgende voor 'dubbel vakantiegeld' [1]. De concrete toepassing hangt af van de anciënniteit, het statuut en het bevoegde paritair comite [2]. Controleer steeds de sectorale CAO, die kan afwijken van de algemene regeling [3].",2,32997,ok
      ella-q492,nl,Wat zijn de regels rond tijdskrediet met motief zorg voor een kind jonger dan 8 jaar?,tijdskrediet,124,"Op basis van de Belgische arbeidswetgeving geldt het volgende voor 'tijdskrediet' [1]. De concrete toepassing hangt af van de anciënniteit, het statuut en het bevoegde paritair comite [2]. Controleer steeds de sectorale CAO, die kan afwijken van de algemene regeling [3].",4,41218,ok
      ella-q115,nl,Welke formele vereisten gelden bij een ontslag om dringende reden en binnen welke termijn moet dit gebeuren?,dringende reden,,"Op basis van de Belgische arbeidswetgeving geldt het volgende voor 'dringende reden' [1]. De concrete toepassing hangt af van de anciënniteit, het statuut en het bevoegde paritair comite [2]. Controleer steeds de sectorale CAO, die kan afwijken van de algemene regeling [3].",3,50143,ok
      ella-q410,nl,Wat is de wettelijke opzeggingstermijn voor een bediende met 7 jaar anciënniteit die door de werkgever wordt ontslagen?,opzeggingstermijn,124,"Op basis van de Belgische arbeidswetgeving geldt het volgende voor 'opzeggingstermijn' [1]. De concrete toepassing hangt af van de anciënniteit, het statuut en het bevoegde paritair comite [2]. Controleer steeds de sectorale CAO, die kan afwijken van de algemene regeling [3].",2,55904,ok
      ella-q596,nl,Mag een werkgever ecocheques vervangen door een equivalent in loon?,ecocheques,200,"Op basis van de Belgische arbeidswetgeving geldt het volgende voor 'ecocheques' [1]. De concrete toepassing hangt af van de anciënniteit, het statuut en het bevoegde paritair comite [2]. Controleer steeds de sectorale CAO, die kan afwijken van de algemene regeling [3].",3,56456,ok
      ella-q106,nl,Welke regels gelden voor studentenarbeid en het contingent van 600 uur?,studentenarbeid,,"Op basis van de Belgische arbeidswetgeving geldt het volgende voor 'studentenarbeid' [1]. De concrete toepassing hangt af van de anciënniteit, het statuut en het bevoegde paritair comite [2]. Controleer steeds de sectorale CAO, die kan afwijken van de algemene regeling [3].",4,52530,ok
      ella-q152,nl,Hoe wordt het gewaarborgd loon berekend bij ziekte van een arbeider tijdens de eerste maand arbeidsongeschiktheid?,gewaarborgd loon,124,"Op basis van de Belgische arbeidswetgeving geldt het volgende voor 'gewaarborgd loon' [1]. De concrete toepassing hangt af van de anciënniteit, het statuut en het bevoegde paritair comite [2]. Controleer steeds de sectorale CAO, die kan afwijken van de algemene regeling [3].",2,54786,ok
      ella-q632,nl,Welke ontslagbescherming geldt voor een zwangere werkneemster?,ontslagbescherming zwangerschap,,"Op basis van de Belgische arbeidswetgeving geldt het volgende voor 'ontslagbescherming zwangerschap' [1]. De concrete toepassing hangt af van de anciënniteit, het statuut en het bevoegde paritair comite [2]. Controleer steeds de sectorale CAO, die kan afwijken van de algemene regeling [3].",2,35347,ok
      ella-q529,fr,Comment calculer le pecule de vacances de sortie pour un employe ?,pecule de vacances de sortie,124,"Sur base de la legislation belge du travail, la regle suivante s'applique a 'pecule de vacances de sortie' [1]. L'application concrete depend de l'anciennete, du statut et de la commission paritaire competente [2]. Verifiez toujours la CCT sectorielle, qui peut deroger au regime general [3].",2,56392,ok
      ella-q142,fr,Quelles sont les regles du credit-temps avec motif soins a un enfant de moins de 8 ans ?,credit-temps,200,"Sur base de la legislation belge du travail, la regle suivante s'applique a 'credit-temps' [1]. L'application concrete depend de l'anciennete, du statut et de la commission paritaire competente [2]. Verifiez toujours la CCT sectorielle, qui peut deroger au regime general [3].",2,55591,ok
      ella-q783,fr,Quelles sont les regles applicables au travail interimaire en Belgique pour un employeur utilisateur ?,travail interimaire,,"Sur base de la legislation belge du travail, la regle suivante s'applique a 'travail interimaire' [1]. L'application concrete depend de l'anciennete, du statut et de la commission paritaire competente [2]. Verifiez toujours la CCT sectorielle, qui peut deroger au regime general [3].",4,44400,ok
