id: id_payroll_calendar
kind: tool
namespace: support-team
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: Dummy payroll calendar — when each client's payroll computation is due
payload:
  workspace_id: support-team-payroll-calendar
  read_only: true
  workspace_view: false
  expand_media_refs: false
  workspace_read:
    instructions: 'One row per (employer, payrollPeriod): periodEndDate, computationDueDate, status (completed
      / completed_with_errors / failed for periods already run, matching los21_payroll_run_status.csv
      exactly for 2026-07 — or upcoming / scheduled for periods not yet run) and notes, e.g. an employer''s
      timesheet-cutoff day from los21_employer_instructions.csv. Compare computationDueDate against the
      current date (given in your own system prompt) to say how soon a client''s payroll is due, or whether
      it''s overdue.'
  resources:
  - file_name: los21_payroll_calendar.csv
    file_type: text
    content: |
      dossierNumber,employerName,payrollPeriod,periodEndDate,computationDueDate,status,notes
