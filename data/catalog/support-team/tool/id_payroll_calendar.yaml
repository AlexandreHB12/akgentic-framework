      0841348,Constructions Ghys SA,2026-08,2026-08-31,2026-09-03,completed,
      0841348,Constructions Ghys SA,2026-09,2026-09-30,2026-10-03,upcoming,Employer instructions list two conflicting Loonverwerking entries - exact cutoff day is unclear.
