# Requires TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN env vars for WhatsApp and
# calls, TWILIO_VOICE_FROM for calls, and SENDGRID_API_KEY /
# SENDGRID_FROM_EMAIL for email — never put credentials in this file. See
# src/client_proxy/tool.py for the full contract.
#
# To use this in a team: add a can_be_hired agent whose agent_class is
# client_proxy.agent.ClientProxy, with role "Client" (or override
# target_role below to match a different role name) — its contact channels
# (whatsapp_number/phone_number/email_address) are set at hire time, by the
# hire_client capability this tool provides, not in the catalog. Give the
# tool itself to whichever agent should be able to hire/contact that client
# (e.g. Team Coordinator) via __ref__: id_trillo_client (same namespace).
id: id_trillo_client
kind: tool
namespace: support-team
user_id: anonymous
model_type: client_proxy.tool.TrilloClientTool
description: >-
  Hire the team's reachable Client (with contact channels given at hire
  time) and reach them via WhatsApp, phone call or email, through Twilio
payload:
  target_role: Client
