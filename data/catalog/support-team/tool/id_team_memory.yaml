id: id_team_memory
kind: tool
namespace: support-team
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: >-
  A small persistent memory for the Team Coordinator — a plain memories.txt
  file in its own workspace, one line of text per memory
payload:
  workspace_id: support-team-memory
  workspace_view: false
  expand_media_refs: false
  workspace_delete: false
  workspace_mkdir: false
  workspace_patch: false
  workspace_read:
    instructions: >-
      memories.txt holds the Team Coordinator's memories, one per line. Line
      numbers (counting from 1) are how a memory is referred to when asked to
      forget one.
  resources:
  - file_name: memories.txt
    file_type: text
    content: ''
