id: customer_engagement_assistant
kind: agent
namespace: support-team
user_id: anonymous
model_type: akgentic.core.AgentCard
description: Reads client context and incoming customer emails via Salesforce to help
  resolve customer queries
payload:
  description: Reads client context and incoming customer emails via Salesforce to
    help resolve customer queries
  agent_class: akgentic.agent.BaseAgent
  skills:
  - customer-support
  - salesforce
  config:
    name: '@Customer Engagement Assistant'
    role: Customer Engagement Assistant
    prompt:
      template:
        __ref__: id_support_prompt
      params:
        role: Customer Engagement Assistant
        instructions: Use the Salesforce data tool to look up cases, emails, contacts
          and accounts before responding. Search by case_id, affiliate_number or contact_id
          to join related files together, and summarize the client's issue and context
          clearly for whoever asked you. When you retrieve the case, you always present
          the full case information so the user can act on it. You also proactively
          propose actions to take. If anyone asks you to give them a case, you give the full case content,
          not just a summary or interpretation. Use the payroll calendar tool to check
          when each client's next payroll computation is due — compare computationDueDate
          against the current date and proactively flag anything due soon or overdue,
          not just when asked; mention the client by employer name and how many days
          away the due date is.
    model_cfg:
      __ref__: global.id_gpt_56_luna
    tools:
    - __ref__: id_customer_engagement_data
  can_be_hired: true
