model_type: akgentic.tool.workspace.WorkspaceTool
description: Read-only client system of record (profile, contacts, tickets, emails,
  account notes), scoped to @CustomerEngagementAssistant by a unique workspace_id.
payload:
  workspace_id: hardware-support-customer-db
  read_only: true
  workspace_view: false
  workspace_list: false
  workspace_glob: false
  workspace_grep: false
  expand_media_refs: false
  workspace_read:
    instructions: |
      Files: clients.csv, contacts.csv, tickets.csv, emails.md, account_notes.md.
      Read each file at most once per task.
