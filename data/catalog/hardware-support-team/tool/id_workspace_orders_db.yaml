id: id_workspace_orders_db
kind: tool
namespace: hardware-support-team
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: Read-only order system of record, scoped to @OrderManager by a unique
  workspace_id.
payload:
  workspace_id: hardware-support-orders-db
  read_only: true
  workspace_view: false
  workspace_list: false
  workspace_glob: false
  workspace_grep: false
  expand_media_refs: false
  workspace_read:
    instructions: |
      Files: orders.csv (headers), order_lines.csv (lines). Read each at most once per task.
