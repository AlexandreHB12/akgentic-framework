id: id_workspace_stock_db
kind: tool
namespace: hardware-support-team
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: Warehouse stock record, read/write, scoped to @StockManager. Narrowed
  to read + edit + multi_edit so rows can change and movements can be appended, but
  no file can be deleted, replaced or created. Seeding never overwrites, so updates
  persist across teams until the files are deleted.
payload:
  workspace_id: hardware-support-stock-db
  read_only: false
  workspace_view: false
  workspace_list: false
  workspace_glob: false
  workspace_grep: false
  expand_media_refs: false
  workspace_write: false
  workspace_delete: false
  workspace_mkdir: false
  workspace_patch: false
  workspace_read:
    instructions: |
      Files: stock.csv, stock_movements.csv. Read each at most once per task.
  workspace_multi_edit:
    instructions: |
      Use for stock.csv: all row changes for one event in ONE call, one edit per row,
      old_string = the full current row exactly as read. Check every row's
      available = on_hand - reserved before calling.
  workspace_edit:
    instructions: |
      Use to append to stock_movements.csv: old_string = the current last line,
      new_string = that same line, a newline, then the new movement lines.
  resources:
  - file_name: stock.csv
    content: |
