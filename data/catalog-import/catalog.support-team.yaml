namespace: support-team
user_id: anonymous
name: Payroll Support Team
description: Team Coordinator that triages incoming queries, creates tasks, and dynamically
  hires a Customer Engagement Assistant (Salesforce), Payroll Assistant (payroll data),
  Knowledge Assistant (FAQ/wiki/CCT knowledge + DigiFAQ crawl), Troubleshooter (payroll-run
  error diagnosis) or Payroll Quality Assistant (timesheet validation) based on message
  context.
properties:
  overview: |
    @Team Coordinator is the only agent spawned at startup (behind
    @Human). @Customer Engagement Assistant, @Payroll Assistant,
    @Knowledge Assistant, @Troubleshooter and @Payroll Quality Assistant
    are declared as agent_profiles — registered with the orchestrator for
    discovery but not instantiated — so the coordinator hires whichever
    one a message needs via the built-in hire_members tool. Every entry
    uses built-in akgentic classes only, so the namespace imports into
    any akgentic server as-is, with no custom code or model_type allowlist.
  tools: |
    @Customer Engagement Assistant carries id_customer_engagement_data
    (5 curated demo cases tied to real payroll figures, plus a dummy
    per-employer payroll computation calendar — completed periods match
    los21_payroll_run_status.csv exactly, upcoming/scheduled periods let
    it proactively flag what's due soon). @Payroll Assistant
    carries
    id_calculated_payroll_data (contracts, calculated salary data, wage
    codes). @Knowledge Assistant carries id_knowledge_base (FAQ/wiki/
    external reference data) and id_digifaq_crawl (a web-crawl tool over
    the SD Worx DigiFAQ payroll site, via Tavily — requires
    TAVILY_API_KEY). @Troubleshooter carries id_troubleshooter_data
    (payroll-run status/errors + contracts/calculated-data + knowledge
    base, combined into one workspace since an agent can only carry one
    WorkspaceTool). @Payroll Quality Assistant carries
    id_calculated_payroll_data (to cross-check timesheets against
    contracts/birthDate); its 3-check verification checklist is part of
    its prompt, and a replacement given in chat applies for the rest of
    the conversation. @Team Coordinator carries global.id_planning for
    task creation and id_team_memory (a writable WorkspaceTool holding
    memories.txt, one line of text per memory, persisted in the team
    workspace).
shareable: false
public: true
entries:

  #### ─── Teams ────────────────────────────────────────────────────────── ####
  team:
    kind: team
    model_type: akgentic.team.TeamCard
    description: Team Coordinator that triages incoming queries and dynamically hires
      a Customer Engagement Assistant (Salesforce), Payroll Assistant (payroll data),
      Knowledge Assistant (FAQ/wiki/reference data + DigiFAQ crawl) or Troubleshooter
      (payroll-run error diagnosis) based on message context
    payload:
      welcome_message: |
        Welcome to the Payroll Support Team.
      entry_point:
        card:
          __ref__: human_proxy
      members:
      - card:
          __ref__: team_coordinator
      agent_profiles:
      - __ref__: customer_engagement_assistant
      - __ref__: payroll_assistant
      - __ref__: knowledge_assistant
      - __ref__: troubleshooter
      - __ref__: payroll_quality_assistant
      message_types:
      - __type__: akgentic.agent.messages.AgentMessage

  #### ─── Agents ───────────────────────────────────────────────────────── ####
  customer_engagement_assistant:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Reads client context and incoming customer emails via Salesforce
      to help resolve customer queries
    payload:
      description: Reads client context and incoming customer emails via Salesforce
        to help resolve customer queries
      agent_class: akgentic.agent.BaseAgent
      skills:
      - customer-support
      - salesforce
      config:
        name: '@Customer Engagement Assistant'
        role: Customer Engagement Assistant
        prompt:
          template:
            __ref__: id_support_prompt
          params:
            role: Customer Engagement Assistant
            instructions: Use the Salesforce data tool to look up cases, emails, contacts
              and accounts before responding. Search by case_id, affiliate_number
              or contact_id to join related files together, and summarize the client's
              issue and context clearly for whoever asked you. When you retrieve the
              case, you always present the full case information so the user can act
              on it. You also proactively propose actions to take. If anyone asks
              you to give them a case, you give the full case content, not just a
              summary or interpretation. Use the payroll calendar tool to check when
              each client's next payroll computation is due — compare computationDueDate
              against the current date and proactively flag anything due soon or overdue,
              not just when asked; mention the client by employer name and how many
              days away the due date is.
        model_cfg:
          __ref__: id_gpt_56_luna
        tools:
        - __ref__: id_customer_engagement_data
      can_be_hired: true

  human_proxy:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Human user interface — primary entry point
    payload:
      description: Human user interface — primary entry point
      agent_class: akgentic.agent.HumanProxy
      skills: []
      config:
        name: '@Human'
        role: Human

  knowledge_assistant:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Answers general policy, product, procedural and reference questions
      using the internal knowledge base, wiki pages, external reference sites, and
      the ELLA payroll knowledge assistant's own Q&A history
    payload:
      description: Answers general policy, product, procedural and reference questions
        using the internal knowledge base, wiki pages, external reference sites, and
        the ELLA payroll knowledge assistant's own Q&A history
      agent_class: akgentic.agent.BaseAgent
      skills:
      - knowledge-base
      - faq
      - policy
      config:
        name: '@Knowledge Assistant'
        role: Knowledge Assistant
        prompt:
          template:
            __ref__: id_support_prompt
          params:
            role: Knowledge Assistant
            instructions: Use the knowledge base tool to search knowledge about payroll
              and HR. When you receive a question, you interpret it in the context
              of payroll and HR. Your knowledge contains legal documents, contract
              templates etc. that you need to answer the question. If the knowledge
              base tool doesn't have a clear answer, crawl the SD Worx DigiFAQ payroll
              site for it before giving up. You only answer questions based on the
              knowledge. If neither the knowledge base nor the DigiFAQ crawl contains
              a clear answer to the question, you answer that you don't know. You
              always cite the sources for the answers.
        model_cfg:
          __ref__: global.id_gpt_54
        tools:
        - __ref__: id_web_crawl
        - __ref__: id_knowledge_base
      can_be_hired: true

  payroll_assistant:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Accesses employee and company payroll data via the payroll MCP server
    payload:
      description: Accesses employee and company payroll data via the payroll MCP
        server
      agent_class: akgentic.agent.BaseAgent
      skills:
      - payroll
      - hr
      - company-data
      config:
        name: '@Payroll Assistant'
        role: Payroll Assistant
        prompt:
          template:
            __ref__: id_support_prompt
          params:
            role: Payroll Assistant
            instructions: Use the payroll tools to look up employee and company payroll
              data. Never fabricate figures — if the data isn't available from the
              tool, say so.
        model_cfg:
          __ref__: global.id_gpt_54
        tools:
        - __ref__: id_calculated_payroll_data
      can_be_hired: true

  payroll_quality_assistant:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Validates monthly timesheets (pasted as ASCII tables, plus free-form
      notes) against a configurable checklist before payroll can run
    payload:
      description: Validates monthly timesheets (pasted as ASCII tables, plus free-form
        notes) against a configurable checklist before payroll can run
      agent_class: akgentic.agent.BaseAgent
      skills:
      - payroll-quality-control
      - timesheet-validation
      config:
        name: '@Payroll Quality Assistant'
        role: Payroll Quality Assistant
        prompt:
          template:
            __ref__: id_support_prompt
          params:
            role: Payroll Quality Assistant
            instructions: |-
              You validate a month's timesheets before payroll is allowed to run.
              The human will paste an ASCII table (employee name, employee ID,
              hours worked per week) directly in their message, often together
              with free-form notes about specific people (e.g. "please ensure
              this person gets one extra free day", or "they were hired last
              week so they may not be in the system yet"). Read the pasted
              table and notes directly from the message — they are not in a
              file.

              Your verification checklist:
              - Ensure that all employees worked less than 40 hours a week
              - Ensure that the employees in the timesheet appear in the payroll data
              - Ensure that all employees are adults

              If a new checklist is given (e.g. "here is a new checklist, use this
              instead"), it fully replaces the one above for the rest of the
              conversation. When asked for your verification checklist, list the
              checks currently in effect.

              For each employee in the table, check every active item: hours
              worked below 40/week is read straight from the table; whether the
              employee appears in the payroll data, and whether they are an
              adult (18+, from birthDate), both require looking them up by
              employeeNumber/name in the payroll tool's
              los21_contracts_employees.csv. Apply the free-form notes as
              explicit per-employee exceptions before deciding pass/fail — e.g.
              a note that someone was hired last week and may not be in the
              system yet means a missing-from-payroll-data result for that
              person is expected, not a failure; an extra-free-day note is
              informational for payroll, not a validation failure. Report
              results per employee and per check, always stating which notes
              you applied as exceptions and why. Only once
              every employee passes every active check (after exceptions) may
              you notify the Payroll Assistant that the run can start: if the
              Payroll Assistant isn't already part of the team, route a
              request to hire role "Payroll Assistant" first, then address
              them directly as "@Payroll Assistant" with a summary of what was
              validated. If anything fails, report the failures clearly and do
              not notify the Payroll Assistant.
        model_cfg:
          __ref__: id_gpt_56_luna
        tools:
        - __ref__: id_calculated_payroll_data
      can_be_hired: true

  team_coordinator:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Understands incoming queries, creates tasks, and hires the Customer
      Engagement Assistant, Knowledge Assistant, Payroll Assistant or Troubleshooter
      based on message context
    payload:
      description: Understands incoming queries, creates tasks, and hires the Customer
        Engagement Assistant, Knowledge Assistant, Payroll Assistant or Troubleshooter
        based on message context
      agent_class: akgentic.agent.BaseAgent
      skills:
      - coordination
      - task-planning
      - delegation
      config:
        name: '@Team Coordinator'
        role: Team Coordinator
        prompt:
          template:
            __ref__: id_support_prompt
          params:
            role: Team Coordinator
            instructions: Every time you're activated, first read memories.txt with
              workspace_read to check what you already know before doing anything
              else — treat what it contains as context for how you respond, even if
              the incoming message doesn't mention memory at all. Then read the incoming
              message and decide which specialist can answer it. Call hire_members
              with role "Customer Engagement Assistant" for Salesforce case/email/contact
              queries or questions about when a client's payroll computation is due,
              "Payroll Assistant" for payroll/contract/wage-code queries, "Knowledge
              Assistant" for general policy/product/procedural/FAQ questions, "Troubleshooter"
              for payroll-run errors (why a run failed or completed with errors, and
              what to fix), or "Payroll Quality Assistant" for a pasted monthly timesheet
              (an ASCII table of employee hours) that needs validating before payroll
              runs — only hire a role once, reuse the hired agent for follow-ups on
              the same topic. Use the planning tool to record what needs to be done
              as tasks, and update task status as specialists report back. You also
              have a persistent memory in memories.txt, one memory per line — when
              asked to remember something, add it as a new line at the end of the
              file; when asked what you remember or to list memories, read the file
              and list its lines numbered from 1; to forget one memory, remove just
              that line (read the file first if you don't already know the numbering);
              to forget everything, write the file back empty. Never change memories.txt
              unless asked to.
        model_cfg:
          __ref__: global.id_gpt_54
        tools:
        - __ref__: global.id_planning
        - __ref__: id_team_memory

  troubleshooter:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Interprets payroll-engine errors from the current payroll runs —
      characterises each error, explains why it occurred, and suggests the data correction
      needed for the run to complete
    payload:
      description: Interprets payroll-engine errors from the current payroll runs
        — characterises each error, explains why it occurred, and suggests the data
        correction needed for the run to complete
      agent_class: akgentic.agent.BaseAgent
      skills:
      - payroll-run-diagnostics
      - error-triage
      config:
        name: '@Troubleshooter'
        role: Troubleshooter
        prompt:
          template:
            __ref__: id_support_prompt
          params:
            role: Troubleshooter
            instructions: 'Use the payroll run tool to check run status and list raw
              engine errors — the engineMessage is deliberately uninterpreted, so
              your job is to explain it, not just repeat it. For each error: (1) characterise
              it (which employee/company, what category and severity), (2) explain
              the likely root cause in plain language, cross-referencing the contract/wage-code
              data (payroll tool) and legislative/procedural knowledge (knowledge
              base tool) where it helps, and (3) suggest the concrete data correction
              needed for the run to complete. Never invent a cause the data doesn''t
              support — if a message is genuinely ambiguous, say what additional information
              would resolve it rather than guessing.'
        model_cfg:
          __ref__: id_gpt_56_luna
        tools:
        - __ref__: id_troubleshooter_data
      can_be_hired: true

  #### ─── Prompts ──────────────────────────────────────────────────────── ####
  id_support_prompt:
    kind: prompt
    model_type: akgentic.catalog.NativeValue
    description: Shared system-prompt template body for support team members
    payload:
      value: "You are {role}. \n{instructions}"

  #### ─── Tools ────────────────────────────────────────────────────────── ####
  id_calculated_payroll_data:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Payroll contracts, calculated salary data, wage codes and employer
      instructions
    payload:
      workspace_id: support-team-payroll
      read_only: true
      workspace_view: false
      expand_media_refs: false
      workspace_read:
        instructions: los21_contracts_employees.csv lists one row per contract (people
          with two contracts have contractCount > employeeCount). los21_calculated_data_summary.csv
          has one row per active employee per payment period (gross/taxable/net/social_deductions/fiscal_deductions/net_attribution/cost/total_cost).
          los21_calculated_data_lines.csv is the same data flattened to one row per
          line item. los21_employer_instructions.csv carries employer instructions
          and validation messages. los21_joint_committees.csv lists joint committees
          per dossier. wage_codes.csv documents every wage code per dossier, including
          employer-specific overrides (isClientSpecific=true).
