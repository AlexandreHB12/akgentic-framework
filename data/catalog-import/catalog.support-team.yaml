        file_type: text
        content: ''

  id_troubleshooter_data:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Payroll run status/errors, contract and calculated payroll data,
      and knowledge-base reference data, combined into one workspace for the Troubleshooter
    payload:
      workspace_id: support-team-troubleshooter
      read_only: true
      workspace_view: false
      expand_media_refs: false
      workspace_read:
        instructions: 'Combines three data sources the Troubleshooter needs together
          in one workspace (a single agent can only carry one WorkspaceTool, since
          each one exposes an identically-named workspace_read tool — see id_payroll_run_tool
          / id_calculated_payroll_data / id_knowledge_base for the same files split
          by role instead). los21_payroll_run_status.csv has one row per (dossier,
          period) payroll run: status (completed / completed_with_errors / failed),
          employees processed, employees with errors. los21_payroll_run_errors.csv
          has one row per raw engine-reported error within a run: errorCode, errorCategory,
          severity, fieldOrCode and an uninterpreted engineMessage — the engine states
          the error as-is; it does not explain why it occurred or how to fix it, that''s
          this tool''s consumer''s job. los21_contracts_employees.csv lists one row
          per contract (people with two contracts have contractCount > employeeCount).
          los21_calculated_data_summary.csv has one row per active employee per payment
          period (gross/taxable/net/social_deductions/fiscal_deductions/net_attribution/cost/total_cost);
          los21_calculated_data_lines.csv is the same data flattened to one row per
          line item. los21_employer_instructions.csv carries employer instructions
          and validation messages. los21_joint_committees.csv lists joint committees
          per dossier. wage_codes.csv documents every wage code per dossier, including
          employer-specific overrides (isClientSpecific=true). digifaq_entries.csv,
          infoweb_documents.csv, payroll_wiki_pages.csv and los21_wiki_pages.csv are
          internal FAQ/wiki articles; external_websites.csv covers RVA/ONEM, FOD WASO/SPF
          Emploi, RSZ/ONSS and NAR/CNT reference pages; ten_commandments.csv is the
          termination checklist (NL/FR); belgian_holidays.csv lists 2026 public/school/bank
          holidays.'
