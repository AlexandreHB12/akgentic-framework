          digifaq-1198,nl,Hoelang loopt het gewaarborgd loon voor een bediende?,"30 kalenderdagen, volledig ten laste van de werkgever.",Een bediende met een contract van onbepaalde duur heeft recht op 30 kalenderdagen gewaarborgd loon ten laste van de werkgever. Voor arbeiders geldt een gefaseerde regeling met tussenkomst van het ziekenfonds vanaf dag 15.,Ziekte,yes,https://digifaq.sd.dika.be/nl/faq/1198,7c72ced6eb50,0.9189,DigiFAQ
          digifaq-0937,nl,Hoeveel bedraagt de maximale waarde van een maaltijdcheque?,"8,00 EUR, waarvan minimaal 1,09 EUR werknemersbijdrage.","De maximale nominale waarde van een maaltijdcheque bedraagt 8,00 EUR. De werkgeversbijdrage bedraagt maximaal 6,91 EUR en de werknemersbijdrage minimaal 1,09 EUR. Cheques worden toegekend per effectief gewerkte dag.",Loonvoordelen,yes,https://digifaq.sd.dika.be/nl/faq/0937,9ff351d32505,0.5797,DigiFAQ
          digifaq-7305,nl,Welke opzeggingstermijn geldt bij ontslag door de werknemer?,"De helft van de werkgeverstermijn, geplafonneerd op 13 weken.","Bij ontslag door de werknemer bedraagt de opzeggingstermijn de helft van de termijn die de werkgever zou moeten respecteren, met een maximum van 13 weken. De termijn gaat in op de maandag volgend op de betekening.",Ontslag,yes,https://digifaq.sd.dika.be/nl/faq/7305,808f9886d3ce,0.5699,DigiFAQ
          digifaq-5121,nl,Wanneer moet een Dimona-aangifte gebeuren?,Ten laatste op het moment dat de werknemer begint te werken.,"De Dimona-aangifte moet ten laatste gebeuren op het ogenblik waarop de werknemer in dienst treedt, dus voor de eerste effectieve arbeidsprestatie. Voor studenten gebeurt de aangifte per kwartaal met vermelding van het aantal uren.",Dimona,yes,https://digifaq.sd.dika.be/nl/faq/5121,c6f61a7400d5,0.5600,DigiFAQ
          digifaq-1561,nl,Wat is het contingent voor studentenarbeid?,600 uur per kalenderjaar aan verminderde solidariteitsbijdrage.,"Studenten kunnen 600 uur per kalenderjaar werken aan een verminderde solidariteitsbijdrage van 8,14% (2,71% werknemer, 5,43% werkgever). Het saldo kan geraadpleegd worden via student@work.",Student,yes,https://digifaq.sd.dika.be/nl/faq/1561,d8a6655312d7,0.6974,DigiFAQ
          digifaq-5801,nl,Wat is de referteperiode voor ecocheques?,Van 1 juni tot 31 mei van het volgende jaar.,De referteperiode voor ecocheques loopt standaard van 1 juni tot 31 mei. Toekenning gebeurt pro rata de effectieve prestaties en gelijkgestelde periodes binnen die referteperiode. Sectorale CAO's kunnen afwijken.,Loonvoordelen,yes,https://digifaq.sd.dika.be/nl/faq/5801,787d984ff722,0.6245,DigiFAQ
          digifaq-1399,fr,Quelle est la duree du salaire garanti pour un employe ?,"30 jours calendrier, entierement a charge de l'employeur.","Un employe sous contrat a duree indeterminee a droit a 30 jours calendrier de salaire garanti a charge de l'employeur. Pour les ouvriers, un regime echelonne s'applique avec intervention de la mutuelle a partir du 15e jour.",Maladie,yes,https://digifaq.sd.dika.be/fr/faq/1399,a44430932137,0.6290,DigiFAQ
          digifaq-1959,fr,Quel est le contingent pour le travail etudiant ?,600 heures par annee civile a cotisation de solidarite reduite.,"Les etudiants peuvent travailler 600 heures par annee civile a une cotisation de solidarite reduite de 8,14% (2,71% travailleur, 5,43% employeur). Le solde est consultable via student@work.",Etudiant,yes,https://digifaq.sd.dika.be/fr/faq/1959,8fd4a0f37e45,0.6899,DigiFAQ
          digifaq-2679,fr,Quelle est la periode de reference des eco-cheques ?,Du 1er juin au 31 mai de l'annee suivante.,La periode de reference des eco-cheques court en principe du 1er juin au 31 mai. L'octroi se fait au prorata des prestations effectives et assimilees dans cette periode. Les CCT sectorielles peuvent y deroger.,Avantages,yes,https://digifaq.sd.dika.be/fr/faq/2679,89fc9c6c1f24,0.7911,DigiFAQ
          digifaq-3260,fr,Quand la declaration Dimona doit-elle etre effectuee ?,Au plus tard au moment ou le travailleur commence a travailler.,"La declaration Dimona doit etre effectuee au plus tard au moment de l'entree en service du travailleur, donc avant la premiere prestation effective. Pour les etudiants, la declaration est trimestrielle avec le nombre d'heures.",Dimona,yes,https://digifaq.sd.dika.be/fr/faq/3260,35ef44da1cf3,0.7270,DigiFAQ
          digifaq-5120,fr,Quel est le montant maximal d'un cheque-repas ?,"8,00 EUR, dont au minimum 1,09 EUR a charge du travailleur.","La valeur nominale maximale d'un cheque-repas est de 8,00 EUR. L'intervention patronale s'eleve a maximum 6,91 EUR et la contribution du travailleur a minimum 1,09 EUR. Les cheques sont octroyes par jour effectivement preste.",Avantages,yes,https://digifaq.sd.dika.be/fr/faq/5120,c417584c5d4b,0.8825,DigiFAQ
          digifaq-7982,fr,Quel delai de preavis s'applique en cas de demission ?,"La moitie du delai employeur, plafonne a 13 semaines.","En cas de demission, le delai de preavis correspond a la moitie du delai que l'employeur devrait respecter, avec un maximum de 13 semaines. Le delai prend cours le lundi suivant la notification.",Licenciement,yes,https://digifaq.sd.dika.be/fr/faq/7982,37dbc37dc367,0.9283,DigiFAQ
