          This board is how you know whether you are still waiting.

          Create ONE task per specialist request the moment you dispatch it, with that
          specialist as the owner and the question as the description. Mark it done only
          when that specialist sends a `response` — a `notification` means still working.

          Before you send anything to @Human, read the board. If any task is still open,
          send nothing and stop. Only when every task is done do you combine the replies
          and answer @Human, once.

